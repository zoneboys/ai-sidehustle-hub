name: Daily Job Update

# 每天北京时间 09:30 自动抓取最新远程职位、副业新机会、在线学习流并更新数据
on:
  schedule:
    - cron: "30 1 * * *"   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch: {}     # 支持在 GitHub 页面手动触发

permissions:
  contents: write

concurrency:
  group: daily-job-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest remote jobs
        run: node scripts/fetch-jobs.mjs

      # 可选：GITHUB_TOKEN 只用于提高 GitHub Search 速率限制（匿名 10 次/分 → 5000 次/分）。
      # 未配置时脚本照常运行，只是该数据源可能少几条，页面会显示「部分来源失败」角标。
      - name: Fetch daily side-hustle opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-hustles.mjs

      - name: Fetch daily online learning feed
        run: node scripts/fetch-learn.mjs

      # 可选增强：sieve 深度情报（未配置 SIEVE_API_KEY 时自动跳过，不影响职位抓取）
      - name: sieve daily scout (optional)
        env:
          SIEVE_API_KEY: ${{ secrets.SIEVE_API_KEY }}
        run: node scripts/sieve-daily-scout.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/daily-scout.json 是可选产物：未配置 key / 额度用尽 / 被拒绝时不会生成，
          # 因此只 add 实际存在的文件，避免 `git add` 因 pathspec 不匹配直接失败。
          for f in data/daily-updates.json data/daily-scout.json data/daily-hustles.json data/daily-learn.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "跳过（本次未生成）：$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📡 daily update: refresh jobs / hustles / learn feed ($(date -u +%F))"
            git push
          fi
